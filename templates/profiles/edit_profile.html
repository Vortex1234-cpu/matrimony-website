<div class="form-check mt-3 mb-2" style="background:var(--cream);padding:14px 18px;border-radius:10px;">
    {{ form.hide_photo }}
    <label class="form-check-label ms-2" for="{{ form.hide_photo.id_for_label }}"
        style="font-weight:600;color:var(--text-dark);">
        🙈 Hide my photo from public search results
    </label>
    <p class="text-muted small mb-0 mt-1">
        Your photo will only be visible to members you've matched with.
        A placeholder avatar will show instead.
    </p>
</div>
