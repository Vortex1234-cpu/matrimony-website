{% extends 'base.html' %}
{% block title %}Update Photo{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="form-section text-center">

                <h3 class="fw-bold mb-4" style="color:var(--primary)">
                    📸 Update Profile Photo
                </h3>

                {% if profile.profile_photo %}
                <img src="{{ profile.profile_photo.url }}" class="rounded-circle mb-4" style="width:120px;height:120px;
                            object-fit:cover;
                            border:4px solid var(--soft-pink)">
                {% else %}
                <div class="mb-4" style="font-size:5rem;">👤</div>
                {% endif %}

                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-4">
                        <input type="file" name="profile_photo" accept="image/*" required class="form-control">
                        <div class="form-text">
                            JPG or PNG. Max 5MB.
                        </div>
                    </div>
                    <button type="submit" class="btn-matrimony-primary
                                   w-100 py-3">
                        <i class="bi bi-upload me-2"></i>
                        Upload Photo
                    </button>
                </form>

                <div class="mt-3">
                    <a href="{% url 'view_my_profile' %}" class="text-decoration-none small"
                        style="color:var(--primary)">
                        ← Back to Profile
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
