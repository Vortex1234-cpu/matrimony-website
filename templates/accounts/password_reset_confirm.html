{% extends 'base.html' %}
{% block title %}Set New Password - TownMatrimony{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="form-section">

                <div class="text-center mb-4">
                    <div style="font-size:3rem;
                                margin-bottom:12px;">🔒</div>
                    <h3 class="fw-bold mb-1" style="color:var(--primary)">
                        Set New Password
                    </h3>
                    <p class="text-muted mb-0">
                        Enter your new password below
                    </p>
                </div>

                {% if validlink %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">
                            New Password *
                        </label>
                        <input type="password" name="new_password1" required class="form-control"
                            placeholder="Enter new password">
                    </div>
                    <div class="mb-4">
                        <label class="form-label">
                            Confirm Password *
                        </label>
                        <input type="password" name="new_password2" required class="form-control"
                            placeholder="Confirm new password">
                    </div>
                    <button type="submit" class="btn-matrimony-primary
                                   w-100 py-3">
                        <i class="bi bi-check-circle me-2"></i>
                        Set New Password
                    </button>
                </form>
                {% else %}
                <div class="text-center">
                    <div class="alert" style="background:#fce4ec;
                                border:none;
                                border-radius:12px;
                                color:#c0392b;">
                        ❌ This reset link is invalid or expired.
                    </div>
                    <a href="{% url 'password_reset' %}" class="btn-matrimony-primary
                              d-inline-block mt-3 px-5 py-2">
                        Request New Link
                    </a>
                </div>
                {% endif %}

            </div>
        </div>
    </div>
</div>
{% endblock %}
