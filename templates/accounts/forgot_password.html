{% extends 'base.html' %}
{% block title %}Forgot Password - TownMatrimony{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="form-section">

                <div class="text-center mb-4">
                    <div style="font-size:3rem;
                                margin-bottom:12px;">🔑</div>
                    <h3 class="fw-bold mb-1" style="color:var(--primary)">
                        Forgot Password?
                    </h3>
                    <p class="text-muted mb-0">
                        Enter your email to reset your password
                    </p>
                </div>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">
                            Email Address *
                        </label>
                        <input type="email" name="email" required class="form-control"
                            placeholder="Enter your registered email">
                    </div>

                    <button type="submit" class="btn-matrimony-primary
                                   w-100 py-3">
                        <i class="bi bi-send me-2"></i>
                        Send Reset Link
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="{% url 'login' %}" class="text-decoration-none small" style="color:var(--primary)">
                        <i class="bi bi-arrow-left me-1"></i>
                        Back to Login
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
