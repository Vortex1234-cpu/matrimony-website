<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8f0;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #fff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(139, 0, 0, 0.1);
        }

        .header {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            padding: 35px 30px;
            text-align: center;
        }

        .header h1 {
            color: #fff;
            margin: 0;
            font-size: 1.8rem;
        }

        .body {
            padding: 35px 30px;
        }

        .highlight-box {
            background: #e8f5e9;
            border-left: 4px solid #27ae60;
            border-radius: 8px;
            padding: 16px 20px;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: #fff !important;
            padding: 14px 32px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            margin: 20px 0;
        }

        .footer {
            background: #f8f8f8;
            padding: 20px 30px;
            text-align: center;
            color: #888;
            font-size: 0.82rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🎉 Interest Accepted!</h1>
        </div>
        <div class="body">
            <p style="font-size:1.1rem;">
                Hello <strong>{{ sender_name }}</strong>,
            </p>
            <div class="highlight-box">
                <strong>✅ {{ receiver_name }}</strong>
                has accepted your interest!<br>
                <span style="color:#888;font-size:0.88rem;">
                    You can now view their contact details.
                </span>
            </div>
            <div style="text-align:center;">
                <a href="{{ site_url }}/matches/sent/" class="btn">
                    View Match →
                </a>
            </div>
        </div>
        <div class="footer">
            © 2026 Matrimony. Rajapalayam, Tamil Nadu
        </div>
    </div>
</body>

</html>
